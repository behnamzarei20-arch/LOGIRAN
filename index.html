  <body>
    <div id="root"></div>
    <script>
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/logiran/sw.js", { scope: "/logiran/" }).catch((error) => console.error("Service worker registration failed:", error));
        });
      }
    </script>
